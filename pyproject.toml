[project]
name = "scenariomine"
version = "0.1.0"
description = "Collector and parser for a cross-repository dataset of OpenSCENARIO (.xosc) files"
requires-python = ">=3.10"
dependencies = ["lxml>=5"]

[project.optional-dependencies]
parquet = ["pyarrow>=15"]
dev = ["jsonschema>=4"]

[project.scripts]
scenariomine = "scenariomine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scenariomine"]
